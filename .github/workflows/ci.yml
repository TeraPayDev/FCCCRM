name: CRAM CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations
      - run: uv run ruff format --check app tests migrations
      - run: uv run mypy app tests
      - run: uv run pytest

  migration-gate:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: cram
          POSTGRES_USER: cram
          POSTGRES_PASSWORD: cram_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cram -d cram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://cram:cram_ci_password@localhost:5432/cram
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv python install 3.14
      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Upgrade migrations
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Verify database foundation
        working-directory: apps/api
        run: uv run python -m app.db.verify_foundation
      - name: Roll back development migration
        working-directory: apps/api
        run: uv run alembic downgrade base
      - name: Re-apply development migration
        working-directory: apps/api
        run: uv run alembic upgrade head

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag cram-api-ci ./apps/api
      - run: docker build --tag cram-web-ci ./apps/web

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: apps/web
        run: pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Export backend runtime dependencies
        working-directory: apps/api
        run: uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file /tmp/cram-api-requirements.txt
      - name: Audit backend dependencies
        run: uvx pip-audit -r /tmp/cram-api-requirements.txt
