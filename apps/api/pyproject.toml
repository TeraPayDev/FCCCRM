[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4,<2",
    "boto3>=1.43.67",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0,<0.21",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0,<1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1,<3",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = ["httpx", "mypy", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "database: tests requiring the PostgreSQL/PostGIS CI database",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
files = ["app", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
pretty = true
